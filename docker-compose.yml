version: '3.8'

services:
  frontend:
    build: ./frontend     # Builds image from Dockerfile
    container_name: nextjs-frontend
    ports:
      - "3000:3000"   # Maps container port 3000 to localhost:3000
    volumes:    # Syncs local code with container for hot reload
      - ./frontend/app:/app/app
      - ./frontend/public:/app/public
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/next.config.ts:/app/next.config.ts
    environment:
      - WATCHPACK_POLLING=true    # Makes hot reload work reliably
    stdin_open: true    # Keeps the container running
    tty: true
    command: npm run dev


