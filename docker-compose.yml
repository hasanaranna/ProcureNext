services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: procurenext
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z

  backend:
    build:
      context: ./backend_fast_api
      dockerfile: Dockerfile
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend_fast_api/.env
    environment:
      PORT: 8000
    volumes:
      - ./backend_fast_api:/app:z
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./frontend # Builds image from Dockerfile
    container_name: nextjs-frontend
    ports:
      - "3000:3000" # Maps container port 3000 to localhost:3000
    volumes:
      # Syncs local code with container for hot reload
      - ./frontend/app:/app/app:z
      - ./frontend/components:/app/components:z
      - ./frontend/public:/app/public:z
      - ./frontend/tsconfig.json:/app/tsconfig.json:z
      - ./frontend/next.config.ts:/app/next.config.ts:z
    environment:
      - WATCHPACK_POLLING=true # Makes hot reload work reliably
      - BACKEND_API_URL=http://backend:8000
    stdin_open: true # Keeps the container running
    tty: true
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
