# ============================================================
# Alembic Configuration - Database Migration Tool
# ============================================================
# PURPOSE:
# - Manages PostgreSQL schema migrations (version-controlled DDL)
# - Tracks all changes to tables: users, organizations, tenders,
#   bids, payments, audit_logs, etc.
# - Supports pgvector column types for semantic embedding storage
#
# USAGE:
#   alembic init migrations          -> Initialize (already done)
#   alembic revision --autogenerate  -> Create migration from model changes
#   alembic upgrade head             -> Apply all pending migrations
#   alembic downgrade -1             -> Rollback last migration
# ============================================================
